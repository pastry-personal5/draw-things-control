# Global configuration for draw-things-control (format version 1).
#
# Copy this file to config/global-config.yaml and edit the paths:
#   cp config/global-config.example.yaml config/global-config.yaml
# config/global-config.yaml is git-ignored because its paths are specific to
# one machine. Use --global-config PATH with run-job or validate-job to read a
# different file.
#
# input_directory and output_directory are required, and unknown keys are errors.
# Paths must be absolute; a leading ~ is expanded to your home directory.

version: 1

# Where a job's relative `input` file is looked up. Must already exist.
input_directory: ~/draw-things/input

# Root for job outputs: a job's relative `output.directory` is created here,
# and a job without `output.directory` writes to <output_directory>/<name>.
# Created if missing.
output_directory: ~/draw-things/output

# Optional. true: each run-job also saves <name>-<timestamp>-job.json (a record
# of every run) and <name>-<timestamp>-job.log (the full log) beside its
# outputs. Default: false (nothing but the generated files is written).
write_job_records: false

# Optional. How long every job waits after each successful run but the last,
# so long chains (especially video) do not overheat the machine. A job file's
# own cooldown mapping replaces this one as a whole. Seconds are 0 to 3600.
# Default when neither file sets it: mode auto with the defaults below.
#
# auto: wait a share of the run that just finished, rounded up to a whole
# second and kept between the two bounds. A 24-minute run waits 12 minutes.
cooldown:
  mode: auto
  ratio: 0.5               # share of the last run's time, above 0 and up to 1; default 0.5
  minimum_seconds: 300     # shortest wait; default 0
  maximum_seconds: 1800    # longest wait; default 3600

# manual: the same fixed wait after every run.
# cooldown:
#   mode: manual
#   seconds: 900

# off: no wait.
# cooldown:
#   mode: off

# Optional. Execution history in state/dtc.db older than this many days is
# pruned when a command opens it. Only database rows are removed, never output
# files, manifests, or logs. 0 keeps history forever; 0 to 3650. Default: 14.
history_retention_days: 14
