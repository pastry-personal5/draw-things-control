# Global configuration for framecontrol (format version 1).
#
# Copy this file to config/global-config.yaml and edit the paths:
#   cp config/global-config.example.yaml config/global-config.yaml
# config/global-config.yaml is git-ignored because its paths are specific to
# one machine. Use --global-config PATH with run-job or validate-job to read a
# different file.
#
# input_directory and output_directory are required, and unknown keys are errors.
# Paths must be absolute; a leading ~ is expanded to your home directory.

version: 1

# Where a job's relative `input` file is looked up. Must already exist.
input_directory: ~/draw-things/input

# Root for job outputs: a job's relative `output.directory` is created here,
# and a job without `output.directory` writes to <output_directory>/<name>.
# Created if missing.
output_directory: ~/draw-things/output

# Optional. true: each run-job also saves <name>-<timestamp>-job.json (a record
# of every run) and <name>-<timestamp>-job.log (the full log) beside its
# outputs. Default: false (nothing but the generated files is written, and a
# video job's <name>-<timestamp>-job-first-image.png, which it keeps either way).
write_job_records: false

# Optional. How long every job waits after each successful run but the last,
# so long chains (especially video) do not overheat the machine. A job file's
# own cooldown mapping replaces this one as a whole. Seconds are 0 to 3600.
# Default when neither file sets it: mode auto with the defaults below.
#
# auto: wait a share of the run that just finished, rounded up to a whole
# second and kept between the two bounds. A 24-minute run waits 12 minutes.
cooldown:
  mode: auto
  ratio: 0.5               # share of the last run's time, above 0 and up to 1; default 0.5
  minimum_seconds: 300     # shortest wait; default 0
  maximum_seconds: 1800    # longest wait; default 3600

# manual: the same fixed wait after every run.
# cooldown:
#   mode: manual
#   seconds: 900

# off: no wait.
# cooldown:
#   mode: off

# Optional. Execution history in state/framecontrol.db older than this many days is
# pruned when a command opens it. Only database rows are removed, never output
# files, manifests, or logs. 0 keeps history forever; 0 to 3650. Default: 14.
history_retention_days: 14

# Optional. An executable the TUI's Execution detail opens a run's file with
# when you click its file name or press Enter. It is called with one argument,
# the file's full path, and runs detached. A path (absolute, or starting with
# ~) or a name found on PATH; it must exist and be executable. If you need
# flags, point this at a small wrapper script. Default: not set, and the file
# is revealed in Finder. `/reveal` always reveals in Finder.
# file_opener: /Applications/IINA.app/Contents/MacOS/iina-cli

# Optional. Bounded work the HTTP API (`fc serve`) enforces from its first
# submission, whoever calls (an agent, fc queue, or --allow-write): every
# key is optional and falls back to its own default below.
# api_limits:
#   max_queued_jobs: 20        # entries queued at once
#   max_job_runs: 100          # runs a submitted job may have, or a resume may have left
#   max_job_seconds: 172800    # one entry's worst case: its runs times run_timeout_seconds,
#                              # plus cooldown (48 hours); backend finishing adds drift,
#                              # color delivery, correction, and handoff deadlines
#   max_job_file_bytes: 65536  # size of job text the API accepts
#   max_reference_file_bytes: 4294967296  # size of one H3 reference (4 GiB)
#   max_reference_bytes: 34359738368  # total size of H3 references in one job (32 GiB)
#   max_job_output_bytes: 34359738368  # estimated H3 MP4 copies, staging, and handoffs in one job (32 GiB)
