# Example job for draw-things-control (job format version 1).
#
# Validate:  uv run python main.py validate-job data/example-job.yaml
# Preview:   uv run python main.py run-job data/example-job.yaml --dry-run
# Run:       uv run python main.py run-job data/example-job.yaml
#
# Relative paths: `input` is read from the global input_directory, and
# `output.directory` is created under the global output_directory.
# `config_file` is a file name only; the app finds it in dt-config/.
# See docs/phase-1/milestone-01-job-definition-batch.md for every rule.

version: 1
name: sunset-walk                      # job name, the base of output file names; [a-z0-9-]
mode: i2v                              # i2i, t2v, or i2v
input: first-frame.png                 # first input, run 1 only (i2i/i2v; not allowed for t2v)
batch_count: 7                         # total runs; run k+1 starts from run k's last frame

# Each batch uses the pair that lists it, or the default pair.
# With batch_count 7: walk, wave, walk, wave, walk, idle, idle.
prompt_pairs:
  - name: walk
    positive: "a woman walks along the beach at sunset, cinematic, gentle camera tracking"
    negative: "blurry, distorted, extra limbs, flickering"
    batches: [1, 3, 5]
  - name: wave
    positive: "she turns and waves at the camera, warm golden light"
    negative: "blurry, distorted, extra limbs, flickering"
    batches: [2, 4]
  - name: idle
    positive: "she stands still at the water's edge, gentle breeze in her hair"
    default: true                      # every batch not listed above; no negative, so the model's recommended one applies

output:
  # directory: sunset-walk             # under the global output_directory; omitted: <output_directory>/<name>
  extension: mov                       # i2v default; mp4 also allowed
  # Files are named sunset-walk-<YYYYmmdd-HHMMSS>-<NNNN>.mov,
  # with the last frame saved as sunset-walk-<YYYYmmdd-HHMMSS>-<NNNN>-last-frame.png,
  # and the job manifest and log as sunset-walk-<YYYYmmdd-HHMMSS>-job.json and -job.log.

# Base configuration for every run: dt-config/image-to-video-wan-2-2.example.json.
config_file: image-to-video-wan-2-2.example.json

# Overrides applied on top of config_file for every run. Any key left out
# comes from config_file, then from the model's recommended settings.
config_override:
  model: wan_v2.2_a14b_hne_i2v_i8x.ckpt          # Wan 2.2 A14B high-noise expert
  refiner_model: wan_v2.2_a14b_lne_i2v_i8x.ckpt  # Wan 2.2 A14B low-noise expert
  refiner_start: 0.1                   # hand over to the refiner after 10% of steps
  steps: 40
  guidance_scale: 5.0
  shift: 3.99
  width: 832                           # pixels, multiple of 64; i2i/i2v: input must be exactly this size
  height: 448                          # pixels, multiple of 64
  frame_count: 17
  strength: 1.0
  seed: 829023514                      # omitted: config_file's seed, else one random seed for the whole job

run_timeout_seconds: 3600              # limit for each run
