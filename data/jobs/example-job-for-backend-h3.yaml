# Example H3 image-to-audio-video job (job format version 2).
#
# H3 is project-installed: contrib/backends/h3.c/h3 and its MiniMax-H3 model
# snapshot must be present. `ffmpeg` and `ffprobe` must also be available.
# Validate: uv run fc validate-job data/jobs/example-job-for-backend-h3.yaml

version: 2
name: autumn-street-audio
input: ./9999-example/example-first-frame.png

# H3 accepts positive prompts only. Run 2 receives the verified final frame
# from run 1, while H3 generates fresh synchronized audio for each run.
prompt_pairs:
  street:
    positive: "A calm autumn street at dusk; leaves stir in a light wind; distant city ambience."

# Closed H3 settings; the duration and seed are per-run knobs below.
settings_profiles:
  h3-portrait:
    backend: h3
    settings:
      width: 768                  # multiples of 32, together no larger than 768 x 1344
      height: 1344
      steps: 30

defaults:
  - backend: h3
    pipeline: i2av
    prompt_pair: street
    settings_profile: h3-portrait
    knobs:
      seconds: 4                  # 1 to 15; Framecontrol derives the frame counts: 96 requested, 90 on H3's 17n + 5 grid
      seed: 42
      timeout_seconds: 3600

runs:
  - {backend: h3, pipeline: i2av}
  - {backend: h3, pipeline: i2av, knobs: {seconds: 6}}    # a longer second run: 144 requested, 141 effective frames

cooldown:
  mode: off
