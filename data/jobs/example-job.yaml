# Example job for draw-things-control (job format version 1).
#
# Validate:  uv run dtc validate-job data/jobs/example-job.yaml
# Preview:   uv run dtc run-job data/jobs/example-job.yaml --dry-run
# Run:       uv run dtc run-job data/jobs/example-job.yaml
#
# Relative paths: `input` is read from the global input_directory, and
# `output.directory` is created under the global output_directory.
# `config_file` is a file name only; the app finds it in data/params/.
# See docs/archive/phase-1/milestone-01-job-definition-batch.md for every rule.

version: 1
name: sunset-walk                      # job name, the base of output file names; [a-z0-9-]
mode: i2v                              # i2i, t2v, or i2v
input: first-frame.png                 # first input, run 1 only (i2i/i2v; not allowed for t2v)
run_count: 7                           # total runs; run k+1 starts from run k's last frame

# Optional (i2i/i2v): resize the first input before run 1, and generate every
# run at that size instead of width/height below. Each value is 1 to 8192 and
# is rounded down to a multiple of 64. With one key, the other follows the
# input's aspect ratio and the leftover pixels are cropped from the center;
# with both keys, the input is letterboxed with black bars.
# desired_input_width: 850             # 1920x1080 input: 832x448, 4.3% cropped
# desired_input_height: 470
# max_input_crop_percent: 10           # one key only; refuse a larger crop (default 10)

# Each run uses the pair that lists it, or the default pair.
# With run_count 7: walk, wave, walk, wave, walk, idle, idle.
prompt_pairs:
  - name: walk
    positive: "a woman walks along the beach at sunset, cinematic, gentle camera tracking"
    negative: "blurry, distorted, extra limbs, flickering"
    runs: [1, 3, 5]
  - name: wave
    positive: "she turns and waves at the camera, warm golden light"
    negative: "blurry, distorted, extra limbs, flickering"
    runs: [2, 4]
  - name: idle
    positive: "she stands still at the water's edge, gentle breeze in her hair"
    default: true                      # every run not listed above; no negative, so the model's recommended one applies

output:
  # directory: sunset-walk             # under the global output_directory; omitted: <output_directory>/<name>
  extension: mov                       # i2v default; mp4 also allowed
  # Files are named sunset-walk-<YYYYmmdd-HHMMSS>-<NNNN>.mov,
  # with the last frame saved as sunset-walk-<YYYYmmdd-HHMMSS>-<NNNN>-last-frame.png,
  # and the job manifest and log as sunset-walk-<YYYYmmdd-HHMMSS>-job.json and -job.log.

# Base configuration for every run: data/params/image-to-video-wan-2-2.example.yaml.
# It must be a YAML file (.yaml or .yml); a .json name is rejected.
config_file: image-to-video-wan-2-2.example.yaml

# Overrides applied on top of config_file for every run. Any key left out
# comes from config_file, then from the model's recommended settings.
config_override:
  model: wan_v2.2_a14b_hne_i2v_i8x.ckpt          # Wan 2.2 A14B high-noise expert
  refiner_model: wan_v2.2_a14b_lne_i2v_i8x.ckpt  # Wan 2.2 A14B low-noise expert
  refiner_start: 0.1                   # hand over to the refiner after 10% of steps
  steps: 40
  guidance_scale: 5.0
  shift: 3.99
  width: 832                           # pixels, multiple of 64; i2i/i2v: input must be exactly this size unless desired_input_* is set
  height: 448                          # pixels, multiple of 64
  frame_count: 17
  strength: 1.0
  seed: 829023514                      # omitted: config_file's seed, else one random seed for the whole job

run_timeout_seconds: 3600              # limit for each run
# cooldown:                            # optional; the wait after each run but the last; replaces the global cooldown as a whole
#   mode: manual                       # auto (a share of the last run's time), manual (fixed seconds), or off
#   seconds: 300                       # manual only; auto takes ratio, minimum_seconds, maximum_seconds
