# Two H3 runs: Ref2VA from two still images, then first-frame i2av (job format version 2).
# Both paths are relative to global-config.yaml's input_directory, not data/jobs/.
# Replace the filenames with images inside that directory before validating.
# Each image identifies a different person; both people are video subjects.
# Run 2 receives run 1's verified last-frame PNG automatically; the job sets no `input`.
# Validate: uv run fc validate-job data/jobs/example-job-for-backend-h3-metal-cli-r2av-to-i2av-two-images.yaml

version: 2
name: example-job-for-backend-h3-metal-cli-r2av-to-i2av-two-images

reference_pairs:
  two-subjects:
    references:
      - kind: image
        path: ./person-1.png
      - kind: image
        path: ./person-2.png

prompt_pairs:
  establish-subjects:
    positive: |
      subject_definitions:
      <Subject 1> is the person in <Picture 1>, using that image for identity, face, hair, clothing, and proportions.
      <Subject 2> is a different person in <Picture 2>, using that image for identity, face, hair, clothing, and proportions.

      summary:
      [reference generation] A steady shot shows the two people, <Subject 1> and <Subject 2>, together for approximately four seconds. Each image defines one person's appearance rather than a first frame.

      retention_analysis:
      <Subject 1> (appears in [Shot 1]): fully_preserved - keep the person's recognizable identity, face, hair, clothing, and proportions from <Picture 1>.
      <Subject 2> (appears in [Shot 1]): fully_preserved - keep the second person's recognizable identity, face, hair, clothing, and proportions from <Picture 2>.

      detailed_description:
      The target video has one continuous shot and a natural photographic appearance.
      [Shot 1] From 00:00 to 00:04, a fixed medium shot holds both people in view together. <Subject 1> retains the face, hair, clothing, and proportions from <Picture 1>, blinks, and turns slightly toward <Subject 2>. <Subject 2> retains the separate face, hair, clothing, and proportions from <Picture 2> and returns the glance with a small head movement. Keep dark areas and saturated colors from the references without adding another person. Both movements settle before the last frame, leaving a clear composition for continuation.

      overall_soundscape:
      Quiet natural ambience with soft clothing rustles as both people move. No dialogue.

      non_diegetic_music:
      N/A
  continue-from-handoff:
    positive: |
      integrated_multimodal_description:
      Continue directly from the supplied first frame, which is the verified final frame of the preceding video. From 00:00 to 00:04, keep the same two people, their distinct faces, hair, clothing, proportions, positions, lighting, and background. The first person makes one small head movement while the second person blinks and settles again. Hold the same fixed camera and avoid a cut, an additional person, or a change of setting. The opening frame should match the supplied image; motion develops smoothly from it.

      overall_soundscape:
      Continue the quiet natural ambience with faint clothing rustles. No dialogue.

      non_diegetic_music:
      N/A
  evolve-interaction:
    positive: |
      integrated_multimodal_description:
      Continue smoothly from the supplied first frame without any cut or interruption. From 00:00 to 00:06, both people engage in a natural conversation. <Subject 1> gestures while speaking, shifting slightly to face <Subject 2> more directly. <Subject 2> listens attentively with responsive facial expressions, occasionally nodding or leaning slightly. Maintain consistent lighting, background, and camera angle throughout. Preserve their distinct appearances and proportions. The interaction feels organic and unscripted, with gentle pacing.

      overall_soundscape:
      Ambient background sounds with subtle environmental textures. Occasional quiet vocalizations and soft movement sounds. No dialogue.

      non_diegetic_music:
      N/A

settings_profiles:
  h3-portrait:
    backend: h3-metal-cli
    settings:
      width: 768
      height: 1344
      steps: 30

defaults:
  - backend: h3-metal-cli
    pipeline: r2av
    prompt_pair: establish-subjects
    settings_profile: h3-portrait
    knobs:
      seconds: 4
      seed: 42
      timeout_seconds: 3600
      reference_pair: two-subjects
  - backend: h3-metal-cli
    pipeline: i2av
    prompt_pair: continue-from-handoff
    settings_profile: h3-portrait
    knobs:
      seconds: 4
      seed: 42
      timeout_seconds: 3600

runs:
  - backend: h3-metal-cli
    pipeline: r2av
  - backend: h3-metal-cli
    pipeline: i2av
    prompt_pair: continue-from-handoff
    knobs:
      seconds: 4
  - backend: h3-metal-cli
    pipeline: i2av
    prompt_pair: evolve-interaction
    knobs:
      seconds: 6

cooldown:
  mode: off
