# Example Draw Things job for Framecontrol (job format version 2).
#
# Validate:  uv run fc validate-job data/jobs/example-job-for-backend-draw-things-cli.yaml
# Run:       uv run fc queue add example-job-for-backend-draw-things-cli.yaml --wait
#
# A job is its `runs`, in order. Each run names a backend and a pipeline, and takes
# its prompt pair and settings profile (and the few values that vary per run) from
# the `defaults` block for that backend and pipeline unless it says otherwise.
#
# Relative paths: `input` is read from the global input_directory, and
# `output.directory` is created under the global output_directory.
# `config_file` is a file name only; the app finds it in data/params/.

version: 2
name: sunset-walk                      # job name, the base of output file names; [a-z0-9-]
input: ./9999-example/example-first-frame.png   # run 1's image (required when run 1 is i2i or i2v; not allowed for t2v)

# Named prompts. A run selects one by name; every pair must be used by some run.
prompt_pairs:
  walk:
    positive: "a woman walks along the beach at sunset, cinematic, gentle camera tracking"
    negative: "blurry, distorted, extra limbs, flickering"
  wave:
    positive: "she turns and waves at the camera, warm golden light"
    negative: "blurry, distorted, extra limbs, flickering"
  idle:
    positive: "she stands still at the water's edge, gentle breeze in her hair"   # no negative: the model's recommended one applies

# Named settings for one backend. Everything that does not change from run to run belongs here.
settings_profiles:
  wan:
    backend: draw-things-cli
    settings:
      # Base configuration for every run using this profile: data/params/image-to-video-wan-2-2.example.yaml.
      # It must be a YAML file (.yaml or .yml); a .json name is rejected.
      config_file: image-to-video-wan-2-2.example.yaml
      # Applied on top of config_file. frame_count and seed are per-run knobs below, not settings.
      config_override:
        model: wan_v2.2_a14b_hne_i2v_i8x.ckpt          # Wan 2.2 A14B high-noise expert
        refiner_model: wan_v2.2_a14b_lne_i2v_i8x.ckpt  # Wan 2.2 A14B low-noise expert
        refiner_start: 0.1                             # hand over to the refiner after 10% of steps
        steps: 40
        guidance_scale: 5.0
        shift: 3.99
        width: 832          # pixels, multiple of 64; the input must be exactly this size unless input_resize is set
        height: 448
        strength: 1.0
        # cfg_zero_star: true             # CFG-Zero* guidance (Draw Things' cfgZeroStar)
        # cfg_zero_init_steps: 0          # the first steps CFG-Zero* zeroes; an integer from 0
        # color_calibration: none         # none, or lab: every frame matched to the run's input inside Draw Things
      output:
        extension: mov                    # video default; mp4 only with h264 or hevc
        # video_format: prores4444        # prores4444 (the default), prores422hq, h264, or hevc
        # Files are named sunset-walk-<YYYYmmdd-HHMMSS>-<NNNN>.mov, with the last frame saved as
        # ...-last-frame.png, and the job manifest and log as ...-job.json and ...-job.log.
      # Optional: resize the image this profile receives (the job's input, or another backend's handoff)
      # and generate at the resulting size instead of width/height above. Each value is 1 to 8192, rounded
      # down to a multiple of 64. With one key, the other follows the image's aspect ratio and the leftover
      # pixels are cropped from the center; with both, the image is letterboxed with black bars.
      # input_resize:
      #   desired_width: 850              # a 1920x1080 input becomes 832x448, 4.3% cropped
      #   desired_height: 470
      #   max_crop_percent: 10            # one key only; refuse a larger crop (default 10)
      # Optional: correct each run's colors; every video run measures its drift either way.
      # color:
      #   anchor: blend                   # none (the default), previous, first, or blend
      #   strength: 1.0                   # 0 to 1: how much of the correction is applied
      #   first_weight: 0.25              # blend only: the share of the gap to the anchor each run closes
      #   reanchor: prompt_pair           # first and blend: prompt_pair (the default) or never
      #   regions: true                   # people, skin, and background apart (Apple Vision, macOS); false: the whole frame

# One block per backend and pipeline that the runs use: what a run takes when it names nothing itself.
defaults:
  - backend: draw-things-cli
    pipeline: i2v
    settings_profile: wan
    knobs:
      frames: 17                          # an exact frame count; a model's frame rate is not known, so `seconds` is not available
      seed: 829023514                     # omitted: one random seed for the whole job
      timeout_seconds: 3600               # limit for each run; required

# The chain: run k+1 starts from run k's last frame. Seven runs: walk, wave, walk, wave, walk, idle, idle.
runs:
  - {backend: draw-things-cli, pipeline: i2v, prompt_pair: walk}
  - {backend: draw-things-cli, pipeline: i2v, prompt_pair: wave}
  - {backend: draw-things-cli, pipeline: i2v, prompt_pair: walk}
  - {backend: draw-things-cli, pipeline: i2v, prompt_pair: wave}
  - {backend: draw-things-cli, pipeline: i2v, prompt_pair: walk}
  - {backend: draw-things-cli, pipeline: i2v, prompt_pair: idle}
  - {backend: draw-things-cli, pipeline: i2v, prompt_pair: idle, knobs: {frames: 33}}   # a run's own knob replaces the default's

# output:
#   directory: sunset-walk              # under the global output_directory; omitted: <output_directory>/<name>
# cooldown:                             # optional; the wait after each run but the last; replaces the global cooldown as a whole
#   mode: manual                        # auto (a share of the last run's time), manual (fixed seconds), or off
#   seconds: 300                        # manual only; auto takes ratio, minimum_seconds, maximum_seconds
