[project]
name = "draw-things-control"
version = "1.0.0"
license = {file = "LICENSE"}
description = "Long-horizon video generation by autoregressive image-to-video chaining, run through the Draw Things app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "grpcio>=1.84.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
dtc = "draw_things_control.cli.app:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.84.0",
    "protobuf>=7.36.2",
    "pyright>=1.1.414",
    "ruff>=0.5.0",
]

[tool.ruff]
# Owner decision: this project intentionally has no maximum line length, for
# linting and formatting alike. Ruff requires a positive value, so use a value
# no line reaches.
line-length = 65535
target-version = "py312"
# gRPC stubs `make proto` generates from server/proto/monitor.proto: not committed, not hand-written, and not held
# to this project's style. One copy per front end with a gRPC client (see the Makefile's PROTO_OUTS).
extend-exclude = ["src/draw_things_control/server/generated", "src/draw_things_control/cli/generated", "src/draw_things_control/tui/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["draw_things_control", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiomatic pattern (Depends(...), Header(...), Query(...) as argument defaults) is not the mutable-default
# footgun B008 warns about: these calls build a marker FastAPI's dependency injection reads, never a shared mutable value.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
include = ["src", "tests"]
# Generated gRPC stubs (see the ruff extend-exclude above): the .pyi files still give pyright what it needs to
# check code that imports them.
exclude = ["src/draw_things_control/server/generated", "src/draw_things_control/cli/generated", "src/draw_things_control/tui/generated"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
