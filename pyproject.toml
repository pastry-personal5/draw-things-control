[project]
name = "draw-things-control"
version = "0.1.0"
license = {file = "LICENSE"}
description = "A safe command-line wrapper for Draw Things image generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "typer>=0.27.2",
    "watchdog>=6.0.0",
]

[project.scripts]
dtc = "draw_things_control.cli.app:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.5.0",
]

[tool.ruff]
# Owner decision: this project intentionally has no maximum line length, for
# linting and formatting alike. Ruff requires a positive value, so use a value
# no line reaches.
line-length = 65535
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["draw_things_control", "tests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# Milestone 11 removes each entry in the step that rewrites its subject; the list is empty when the milestone is done.
ignore = [
    "tests/state",  # Step 4: the store returns typed rows
    "tests/jobs/test_job_service.py",  # Step 3
    "tests/core/test_service.py",  # Step 2
    "tests/tui/test_job_definitions.py",  # Step 6
    "tests/cli/test_state_cli.py",  # Step 5
]
