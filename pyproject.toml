[project]
name = "draw-things-control"
version = "0.1.0"
license = {file = "LICENSE"}
description = "A safe command-line wrapper for Draw Things image generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff>=0.5.0",
]

[tool.ruff]
# Owner decision: this project intentionally has no maximum line length.
# Ruff requires a positive value, so use its largest supported value.
line-length = 65535

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = []

[tool.black]
# Owner decision: no maximum line length (same value as Ruff's line-length).
line-length = 65535
target-version = ["py312"]
