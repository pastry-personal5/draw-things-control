syntax = "proto3";

package framecontrol.monitor;

// Watching for change: a grpc.aio.server() beside uvicorn in the same `fc serve` process, not an
// HTTP endpoint, since nothing here writes (writes stay HTTP POST). Authentication is a server interceptor reading
// the "authorization" metadata key ("Bearer <token>"), the same bearer token as the HTTP API; missing or wrong, the
// call ends UNAUTHENTICATED. `tui/` and `cli/` (`fc queue add --wait`) each import their own generated client stubs
// from this same file; only `server/` imports the generated server code. `mcp_server/` watches an entry over the
// HTTP API's SSE watch (`GET /v1/queue/{id}/watch`), which sends WatchQueueEntry's snapshots.
service Monitor {
  // Replaces GET /events: the job events (jobs/events.py's event_to_dict) and the queue's own (an entry's
  // state change, and the start and end of a between-jobs wait, each naming the entry). Event.id increases within
  // one run of the server; a client reconnecting with an earlier run's ID, or one older than the server's bounded
  // in-memory backlog, gets a Reset event and should read the state again over HTTP before resubscribing.
  rpc WatchEvents(WatchEventsRequest) returns (stream Event);

  // Replaces GET /queue/{id}?wait=: one message whenever the entry's state, execution ID, current run, forecast,
  // cooldown_until, error, park reservation, or the queue's hold changes, until the client cancels the call.
  rpc WatchQueueEntry(WatchQueueEntryRequest) returns (stream QueueEntrySnapshot);
}

message WatchEventsRequest {
  // 0 means "only events from now on"; otherwise replay every event after this ID first.
  int64 last_event_id = 1;
  // Ask for child output lines (run_output) too, since they are many.
  bool include_output = 2;
}

message Event {
  int64 id = 1;
  // One of jobs/events.py's EVENT_KINDS (job_started, run_started, run_output, stage_started,
  // stage_finished, timing_started, timing_finished, run_finished, cooldown_started, cooldown_ended, media_checked,
  // first_image_dropped, job_finished), the queue's own (queue_entry_changed, queue_wait_started, queue_wait_ended,
  // queue_park_changed, queue_held, queue_released, forecast_updated), or "reset" (data_json empty: the client's
  // last_event_id is unusable, and it should re-sync over HTTP).
  string kind = 2;
  // The event's own fields, exactly as event_to_dict (or the queue's own equivalent mapping) produces them, as
  // JSON: one generic payload instead of one message per event kind, since every client already reads this same
  // shape from the job event stream; a typed message per kind would just duplicate that schema.
  string data_json = 3;
}

message WatchQueueEntryRequest {
  // A queue entry's public ID (Q0007), any letter case, leading zeros optional, exactly as the HTTP API takes it.
  string queue_id = 1;
}

message QueueEntrySnapshot {
  string queue_id = 1;
  string state = 2;
  optional string execution_id = 3;
  optional int32 current_run = 4;
  optional double current_run_elapsed_seconds = 5;
  optional double cooldown_until = 6;
  optional string error = 7;
  // Fields 8 and 9 were the current run's latest diffusion-step reading (a global counter that was wrong for H3, whose phases
  // each count their own); the forecast's stage and units replace them. Closed, with their names, so that nothing is ever
  // given them again.
  reserved 8, 9;
  reserved "current_step", "current_step_total";
  // The whole chain's run count (state/queue.py's own total_runs), so `fc queue add --wait` can
  // print "run 3/7" the way the Queue widget does, from the entry's stored column alone.
  optional int32 total_runs = 10;
  // Whether the entry has a park reservation (it ends once its current run finishes), and whether the
  // queue is held, so `fc queue add --wait` can say its queued entry waits behind a hold. Both always set.
  optional bool park_requested = 11;
  optional bool queue_held = 12;
  // ``job`` or ``generate``, so a watcher never has to infer a one-off from an empty job path.
  string kind = 13;
  // The running job's forecast as the server last published it, unset when there is none. A snapshot is sent when the
  // forecast is republished and never because time passed: a client counts down from its ends on a clock of its own.
  optional Forecast forecast = 14;
}

// When something began and is expected to end, in epoch seconds, with the 80% range and the share (0 to 1) the server
// has already shown, which a client's bar never falls below.
message ForecastSpan {
  double started_at = 1;
  double end_at = 2;
  double low = 3;
  double high = 4;
  double floor = 5;
}

// What a forecast rests on: the history tier (signature, backend_fit, pipeline_fit, live_only), whether that history is
// live or pooled with rows rebuilt from logs, how many runs and executions, whether the newest was timed on another
// build, the stages the history had not seen, the ridge penalty, and the rows that could not be read. `knobs` says where
// the numbers that are not the history's came from (factory, provisional, or pinned by a hand edit), and `knobs_updated_at`
// when the calibration they come from was written (unset for the factory).
message ForecastBasis {
  string tier = 1;
  string fidelity = 2;
  int32 runs = 3;
  int32 executions = 4;
  bool build_changed = 5;
  repeated string unseen = 6;
  optional double penalty = 7;
  int32 skipped = 8;
  string knobs = 9;
  optional string knobs_updated_at = 10;
}

message Forecast {
  // The server's clock, in epoch seconds, when it was made.
  double as_of = 1;
  // The active stage and its units; unset in a cooldown or between runs, and the units unset for a stage that counts none.
  optional string stage = 2;
  optional int32 stage_done = 3;
  optional int32 stage_total = 4;
  // Unset when the server has no number to give for it.
  optional ForecastSpan run = 5;
  optional ForecastSpan job = 6;
  ForecastBasis basis = 7;
}
